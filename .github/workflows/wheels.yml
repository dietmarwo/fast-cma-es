name: Wheels

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Optional publish target for a manual run"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - testpypi

permissions:
  contents: read

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # A tag must equal v + the pyproject version: publishing uses
      # skip-existing, so a tag without the version bump would silently
      # publish nothing.
      - name: Require the tag to match the package version
        shell: bash
        run: |
          version="$(python scripts/package_version.py)"
          echo "version $version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            deployment_target: ""
            manylinux_image: "manylinux_2_28"
          - os: windows-latest
            deployment_target: ""
            manylinux_image: ""
          - os: macos-15-intel
            deployment_target: "10.13"
            manylinux_image: ""
          - os: macos-15
            deployment_target: "11.0"
            manylinux_image: ""

    steps:
      - uses: actions/checkout@v5

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }}
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_image }}

      - uses: actions/upload-artifact@v6
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build and test sdist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      # The source build that pip runs when no wheel matches; Eigen and
      # nanobind are fetched as in the wheel builds.
      - name: Install the sdist and run the tests outside the checkout
        shell: bash
        run: |
          python -m pip install pytest
          python -m pip install dist/*.tar.gz \
            --config-settings=cmake.define.FCMAES_FETCH_EIGEN=ON
          work="$(mktemp -d)"
          cp -r tests "$work/tests"
          mkdir -p "$work/examples" && cp examples/pareto_mode.py "$work/examples/"
          cd "$work"
          EXPECTED_VERSION="$(python "$GITHUB_WORKSPACE/scripts/package_version.py")" \
            python -c "import os; from importlib.metadata import version; assert version('fcmaes') == os.environ['EXPECTED_VERSION']"
          PYTHONSAFEPATH=1 python -m pytest tests -q

      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  publish_testpypi:
    name: Publish to TestPyPI
    needs:
      - version
      - build_wheels
      - build_sdist
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true

  publish_pypi:
    name: Publish to PyPI
    needs:
      - version
      - build_wheels
      - build_sdist
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
