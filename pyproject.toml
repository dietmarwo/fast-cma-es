[build-system]
requires = [
  "scikit-build-core>=0.12.2",
  "nanobind>=2.12.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "fcmaes"
version = "2.1.0"
description = "Parallel gradient-free optimization for Python: black-box, multi-objective and quality-diversity search."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
authors = [
  { name = "Dietmar Wolz", email = "drdietmarwolz@yahoo.de" },
]
license = { text = "MIT" }
keywords = ["optimization", "black-box", "gradient-free", "parallel", "CMA-ES", "multi-objective", "quality-diversity"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy",
  "scipy",
  "scikit-learn",
  "threadpoolctl",
  "loguru",
]

[project.optional-dependencies]
jit = [
  "numba",
]

[project.urls]
"Optimization ecosystem" = "https://dietmarwo.github.io/optimization-jobs/"
"AI agent guide" = "https://github.com/dietmarwo/optimization-jobs/blob/main/ai-context.md"
Homepage = "https://github.com/dietmarwo/fast-cma-es"
Repository = "https://github.com/dietmarwo/fast-cma-es"
Documentation = "https://dietmarwo.github.io/fast-cma-es/"
Tutorials = "https://dietmarwo.github.io/fast-cma-es/tutorials/"
Issues = "https://github.com/dietmarwo/fast-cma-es/issues"
Changelog = "https://github.com/dietmarwo/fast-cma-es/blob/master/CHANGELOG.md"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["fcmaes"]
cmake.build-type = "Release"
ninja.make-fallback = true

[tool.scikit-build.sdist]
exclude = [
  ".git",
  ".github",
  ".idea",
  ".pytest_cache",
  ".settings",
  ".venv",
  "build",
  "dist",
  "docs",
  "examples",
  "scripts",
  "tests",
  "tutorials",
  "*.png",
  "*.jpg",
  "*.jpeg",
  "*.gif",
  "*.ipynb",
  "*.pdf",
]

[tool.cibuildwheel]
build = "cp3{10,11,12,13}-*"
skip = [
  "*-win32",
  "*-manylinux_i686",
  "*-musllinux_*",
]
build-verbosity = 1
test-requires = ["pytest"]
test-sources = ["tests", "examples/pareto_mode.py", "examples/external_simulator.py"]
test-command = "pytest ./tests -q"
test-environment = { PYTHONSAFEPATH = "1" }

[tool.cibuildwheel.config-settings]
"cmake.define.FCMAES_FETCH_EIGEN" = "ON"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
archs = ["x86_64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
